[workspace]
members = [
    "crates/daw_cli",
    "crates/daw_engine",
    "crates/daw_media",
    "crates/daw_model",
    "crates/daw_vcs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/daw"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
